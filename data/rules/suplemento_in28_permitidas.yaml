id: suplemento_in28_permitidas
versao: "2026-11-23"
categoria: suplemento
fonte: "Anvisa, IN 28/2018 compilada, Anexo V (lista de alegações autorizadas), entradas Magnésio e Vitamina B6"
referencia: "https://antigo.anvisa.gov.br/documents/10181/3898888/%289%29IN_28_2018_COMP.pdf/96d76e7f-78c3-4fce-a2b2-561805d9b4b3"
nota: "Só os constituintes do suplemento fictício. Texto extraído da versão compilada (que cita alterações até a IN 284/2024) e conferido contra o PDF pelo Lucas em 23/11/2026. A alegação de B6 sobre o sistema nervoso (alteração de 2026) foi confirmada em vigor pelo Lucas em 23/11/2026."
status: conferido
pagina: null                    # não verificável: site da Anvisa fora do ar em 23/11/2026
constituintes:
  - nome: Magnésio
    alegacoes_permitidas:
      - "O magnésio auxilia na formação de ossos e dentes."
      - "O magnésio auxilia no metabolismo energético."
      - "O magnésio auxilia no metabolismo de proteínas, carboidratos e gorduras."
      - "O magnésio auxilia no equilíbrio dos eletrólitos."
      - "O magnésio auxilia no funcionamento muscular."
      - "O magnésio auxilia no funcionamento neuromuscular."
      - "O magnésio auxilia no processo de divisão celular."
    alegacoes_de_conteudo:
      - "Fonte de magnésio."
      - "Alto conteúdo/Rico em/Alto teor de magnésio."
    condicao: "As alegações são restritas aos suplementos alimentares cuja quantidade de magnésio atenda aos valores mínimos estabelecidos no Anexo III desta Instrução Normativa. Alto conteúdo: quantidade correspondente ao dobro dos valores mínimos do Anexo III, desde que não ultrapasse o limite máximo do Anexo IV."
  - nome: Vitamina B6
    alegacoes_permitidas:
      - "A vitamina B6 auxilia na formação das células vermelhas do sangue."
      - "A vitamina B6 auxilia no funcionamento do sistema imune."
      - "A vitamina B6 auxilia no metabolismo energético."
      - "A vitamina B6 auxilia no metabolismo de proteínas e do glicogênio."
      - "A vitamina B6 auxilia no metabolismo de proteínas, carboidratos e gorduras."
      - "A vitamina B6 auxilia no metabolismo de homocisteína."
      - "A vitamina B6 auxilia na síntese de cisteína."
      - "A vitamina B6 auxilia na função normal do sistema nervoso."   # alteração de 2026; em vigor (confirmado pelo Lucas, 23/11/2026)
    alegacoes_de_conteudo:
      - "Fonte de vitamina B6."
      - "Alto conteúdo/Rico em/Alto teor de vitamina B6."
    condicao: "Mesma regra de valores mínimos (Anexo III) e de dobro dos mínimos sem ultrapassar o máximo (Anexo IV)."
